<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trinzo — Back-office Control Surface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN SYSTEM — navy/turquoise, Roboto (§2)
   ============================================================ */
:root{
  --navy:#01163B; --navy-soft:#1b2f55; --turq:#17D0C4; --turq-tint:#e3faf8;
  --slate:#607382; --grey:#E0E3E7; --grey-tint:#f3f5f7;
  --ink:#0c1320; --ink-soft:#3d4654; --ink-faint:#7d8794;
  --green:#198754; --green-tint:#e4f2eb;
  --amber:#9a6b00; --amber-tint:#f6eed8;
  --red:#b3261e;   --red-tint:#f7e4e2;
  --navy-tint:#e6eaf1;
  --shadow:0 1px 3px rgba(1,22,59,.08),0 1px 2px rgba(1,22,59,.06);
  --shadow-lg:0 10px 40px rgba(1,22,59,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Roboto',system-ui,sans-serif;color:var(--ink);background:var(--grey-tint);font-size:14px;line-height:1.5}
a{color:inherit}
button{font-family:inherit;cursor:pointer}

/* HEADER */
header{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;display:flex;align-items:center;
  gap:18px;padding:0 22px;height:60px;box-shadow:0 2px 10px rgba(1,22,59,.25)}
.logo{display:flex;align-items:center;gap:11px;font-weight:700;font-size:17px;letter-spacing:.3px}
.logo .mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--turq),#0fa79d);
  display:grid;place-items:center;color:var(--navy);font-weight:700;font-size:16px}
.tagline{color:#9fb0cc;font-size:12.5px;font-weight:400;border-left:1px solid #2b426b;padding-left:16px}
.role-switch{margin-left:auto;display:flex;align-items:center;gap:10px}
.role-switch label{font-size:11px;color:#9fb0cc;text-transform:uppercase;letter-spacing:.6px}
.role-switch select{background:var(--navy-soft);color:#fff;border:1px solid #2b426b;border-radius:7px;
  padding:8px 11px;font-size:13px;font-weight:500;min-width:210px}
.role-note{font-size:11.5px;color:#9fb0cc;max-width:210px;line-height:1.35}

/* APP LAYOUT */
.app{display:flex;align-items:stretch;min-height:calc(100vh - 60px)}
nav.sidebar{width:226px;flex:0 0 226px;background:var(--navy);color:#c9d4e6;padding:14px 10px 40px;
  position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
nav.sidebar .nav-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;
  font-size:13.5px;font-weight:500;color:#c9d4e6;margin-bottom:2px;position:relative;transition:background .12s}
nav.sidebar .nav-item:hover{background:var(--navy-soft)}
nav.sidebar .nav-item.active{background:var(--turq);color:var(--navy);font-weight:700}
nav.sidebar .nav-item .ni-ico{width:17px;text-align:center;font-size:14px;opacity:.85}
nav.sidebar .nav-item.active .ni-ico{opacity:1}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:11px;
  min-width:19px;height:19px;padding:0 6px;display:grid;place-items:center;line-height:1}
.nav-item.active .nav-badge{background:var(--navy);color:#fff}
.nav-badge.warn{background:var(--amber)}
.nav-sec{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#607b9e;
  padding:14px 12px 6px;font-weight:700}

main{flex:1;padding:26px 30px 60px;max-width:1180px;width:100%;margin:0 auto}
.page-head{margin-bottom:20px}
.page-head h1{font-size:23px;font-weight:700;color:var(--navy);letter-spacing:-.2px}
.page-head p{color:var(--ink-soft);font-size:13.5px;margin-top:4px;max-width:720px}

/* CARDS */
.card{background:#fff;border:1px solid var(--grey);border-radius:12px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:3px}
.card h2 .sub{font-weight:400;color:var(--ink-faint);font-size:12.5px}
.card .card-desc{color:var(--ink-soft);font-size:12.5px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}

/* CHIPS */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:20px;
  padding:3px 10px;letter-spacing:.2px;white-space:nowrap;border:1px solid transparent}
.chip.extract{background:var(--navy-tint);color:var(--navy)}
.chip.draft{background:var(--turq-tint);color:#0b6b64}
.chip.audit{background:var(--amber-tint);color:var(--amber)}
.chip.retrieve{background:var(--grey-tint);color:var(--slate);border-color:var(--grey)}
.chip.green{background:var(--green-tint);color:var(--green)}
.chip.amber{background:var(--amber-tint);color:var(--amber)}
.chip.red{background:var(--red-tint);color:var(--red)}
.chip.navy{background:var(--navy-tint);color:var(--navy)}
.chip.class-lead{background:var(--green-tint);color:var(--green)}
.chip.class-assist{background:var(--amber-tint);color:var(--amber)}
.chip.class-excluded{background:var(--red-tint);color:var(--red)}
.chip.ghost{background:transparent;border-color:var(--grey);color:var(--slate)}

/* STAT TILES (§2) */
.stat{background:#fff;border:1px solid var(--grey);border-radius:12px;padding:16px 16px 14px;box-shadow:var(--shadow)}
.stat .label{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.stat .value{font-size:28px;font-weight:700;color:var(--navy);margin:4px 0 2px;line-height:1.05}
.stat .value.small{font-size:22px}
.stat .foot{font-size:11.5px;color:var(--ink-soft)}
.stat.hero{border-top:3px solid var(--turq)}
.stat.secondary{background:var(--grey-tint);box-shadow:none;opacity:.92}
.stat.secondary .value{font-size:20px;color:var(--slate)}
.stat.secondary .label{color:var(--ink-faint)}
.stat.danger{border-top:3px solid var(--red)}
.stat.good{border-top:3px solid var(--green)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:8px;
  padding:9px 15px;font-size:13px;font-weight:600;transition:filter .12s,background .12s;line-height:1}
.btn:hover{filter:brightness(.95)}
.btn.primary{background:var(--navy);color:#fff}
.btn.turq{background:var(--turq);color:var(--navy)}
.btn.ghost{background:#fff;border-color:var(--grey);color:var(--ink-soft)}
.btn.ghost:hover{background:var(--grey-tint)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}

/* TABLES */
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--navy);color:#fff;text-align:left;padding:9px 12px;font-weight:600;font-size:12px;
  letter-spacing:.3px;position:sticky;top:0}
th:first-child{border-top-left-radius:8px}th:last-child{border-top-right-radius:8px}
tbody td{padding:9px 12px;border-bottom:1px solid var(--grey);vertical-align:top}
tbody tr:hover{background:var(--grey-tint)}
.tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--grey)}

/* FILTER BAR */
.filterbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.filterbar .fb-label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);font-weight:600;margin-right:2px}
.fpill{border:1px solid var(--grey);background:#fff;border-radius:20px;padding:6px 13px;font-size:12.5px;
  font-weight:500;color:var(--ink-soft)}
.fpill.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.fpill.eng.active{background:var(--turq);color:var(--navy);border-color:var(--turq)}

/* QUEUE ITEM CARDS */
.qgroup-title{font-size:13px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.6px;
  margin:22px 0 10px;display:flex;align-items:center;gap:9px}
.qgroup-title .cnt{background:var(--navy-tint);color:var(--navy);border-radius:11px;font-size:11px;padding:1px 9px}
.qitem{background:#fff;border:1px solid var(--grey);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);
  margin-bottom:13px;transition:opacity .35s,transform .35s}
.qitem.flagged{border-left:4px solid var(--amber)}
.qitem.excl{border-left:4px solid var(--red)}
.qitem.removing{opacity:0;transform:translateX(40px)}
.qmeta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:9px}
.qitem h3{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:5px}
.qbody{font-size:13px;color:var(--ink-soft);margin-bottom:10px}
.caveat{background:var(--amber-tint);color:var(--amber);border-radius:8px;padding:8px 12px;font-size:12.5px;
  font-weight:500;margin-bottom:10px;display:flex;gap:8px}
.routing{background:var(--grey-tint);border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--ink-soft);margin-bottom:10px}
.routing b{color:var(--navy)}
.prov{font-family:'Roboto Mono',monospace;font-size:11px;color:var(--ink-faint);background:var(--grey-tint);
  border-radius:6px;padding:7px 10px;margin-bottom:10px;line-height:1.6;word-break:break-word}
.verified{color:var(--green);font-weight:600}
.frame-box{background:var(--turq-tint);border:1px solid #b6ede9;border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:12.5px}
.frame-box .ttl{font-weight:700;color:#0b6b64;font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.frame-box .row{margin-bottom:3px}.frame-box .row b{color:var(--navy)}
.needs-frame{background:var(--navy);color:#fff;border-radius:8px;padding:12px 14px;margin-bottom:10px}
.needs-frame .t{font-weight:700;margin-bottom:3px;font-size:13px}
.needs-frame .d{font-size:12px;color:#c9d4e6;margin-bottom:9px}
.trail{font-size:11.5px;color:var(--ink-faint);margin-bottom:10px}
.trail .step{display:inline-block}
.gate-artefact{background:#f0f6ff;border-left:3px solid var(--navy);border-radius:6px;padding:8px 12px;font-size:12px;margin-bottom:10px}
.gate-artefact .who{font-weight:700;color:var(--navy)}
.qactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.audit-flags{margin-bottom:10px}
.aflag{border:1px solid var(--grey);border-radius:8px;padding:9px 11px;margin-bottom:7px;font-size:12.5px}
.aflag .claim{font-weight:600;color:var(--ink)}
.aflag .src{color:var(--ink-faint);font-size:11.5px;margin:3px 0 7px}
.aflag .fbtns{display:flex;gap:6px;flex-wrap:wrap}
.aflag-status{font-size:11px;font-weight:700;padding:2px 8px;border-radius:11px}
.tiny-btn{border:1px solid var(--grey);background:#fff;border-radius:6px;padding:4px 9px;font-size:11px;font-weight:600;color:var(--ink-soft)}
.tiny-btn.on-valid{background:var(--red);color:#fff;border-color:var(--red)}
.tiny-btn.on-addressed{background:var(--green);color:#fff;border-color:var(--green)}
.tiny-btn.on-wrong{background:var(--slate);color:#fff;border-color:var(--slate)}

/* EMPTY STATE */
.empty{text-align:center;padding:46px 20px;background:#fff;border:1px dashed var(--grey);border-radius:12px}
.empty .big{font-size:19px;font-weight:700;color:var(--navy);margin-bottom:6px}
.empty p{color:var(--ink-soft);font-size:13px}

/* PROCESS CHAINS */
.chain{background:#fff;border:1px solid var(--grey);border-radius:12px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.chain-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:5px}
.chain-head h3{font-size:15px;font-weight:700;color:var(--navy)}
.chain-meta{font-size:11.5px;color:var(--ink-faint)}
.gate-bar{background:var(--navy);color:#fff;border-radius:8px;padding:9px 13px;font-size:12.5px;margin:12px 0 14px;display:flex;gap:8px}
.gate-bar .k{color:var(--turq);font-weight:700;white-space:nowrap}
.steps{display:flex;gap:0;overflow-x:auto;padding-bottom:6px}
.step{flex:1;min-width:150px;border-radius:9px;padding:11px 12px;margin-right:8px;border:1px solid var(--grey);position:relative}
.step:last-child{margin-right:0}
.step.done{background:var(--green-tint);border-color:#bfe3cf}
.step.active{background:var(--turq-tint);border-color:#a7e8e3}
.step.blocked{background:var(--red-tint);border-color:#eec2be}
.step.pending{background:var(--grey-tint)}
.step .snum{font-size:10px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px}
.step .sname{font-size:13px;font-weight:700;color:var(--ink);margin:3px 0}
.step .sowner{font-size:11.5px;color:var(--ink-soft)}
.step .snote{font-size:11px;color:var(--ink-faint);margin-top:5px;line-height:1.4}
.step .sstatus{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:6px;display:inline-block}
.step.done .sstatus{color:var(--green)}.step.active .sstatus{color:#0b6b64}
.step.blocked .sstatus{color:var(--red)}.step.pending .sstatus{color:var(--ink-faint)}

/* WORKBENCH */
.wb-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.wb-col{border:1px solid var(--grey);border-radius:12px;padding:16px;background:#fff}
.wb-col.newv{background:var(--green-tint);border-color:#bfe3cf}
.wb-col h3{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:11px;display:flex;gap:8px;align-items:center}
.wb-field{margin-bottom:12px}
.wb-field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);font-weight:700;margin-bottom:4px}
textarea,input[type=text],select.form{width:100%;border:1px solid var(--grey);border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;color:var(--ink)}
textarea.mono{font-family:'Roboto Mono',monospace;font-size:12px;line-height:1.6;min-height:120px;resize:vertical}
.wb-out{background:var(--navy);color:#d7e2f2;border-radius:8px;padding:12px 14px;font-size:12.5px;margin-top:12px;font-family:'Roboto Mono',monospace;line-height:1.6}
.unverified-tag{display:inline-block;background:var(--amber);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}

/* PROGRESS BARS */
.pbar{background:var(--grey);border-radius:20px;height:9px;overflow:hidden;margin-top:5px}
.pbar > span{display:block;height:100%;background:var(--turq);border-radius:20px}
.pbar.navy > span{background:var(--navy)}

/* STATUS DOTS */
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.dot.green{background:var(--green)}.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}
.dot.grey{background:var(--slate)}.dot.turq{background:var(--turq)}
.dot.pulse{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* KPI TABS */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--grey);margin-bottom:18px}
.tab{padding:9px 15px;font-size:13px;font-weight:600;color:var(--ink-faint);border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.active{color:var(--navy);border-bottom-color:var(--turq)}

/* FLAG / ALERT rows */
.flagrow{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:9px;margin-bottom:8px;font-size:12.5px}
.flagrow.warn{background:var(--amber-tint)}
.flagrow.bad{background:var(--red-tint)}
.flagrow.ok{background:var(--green-tint)}
.flagrow .fi{font-size:16px}
.flagrow .ft{font-weight:700;color:var(--ink)}
.flagrow .fd{color:var(--ink-soft);margin-top:2px}

/* MODAL */
#modal-overlay{position:fixed;inset:0;background:rgba(1,22,59,.55);z-index:100;display:none;align-items:flex-start;
  justify-content:center;padding:40px 16px;overflow-y:auto}
#modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;max-width:620px;width:100%;box-shadow:var(--shadow-lg);animation:pop .18s ease}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--grey);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-head h2{font-size:17px;font-weight:700;color:var(--navy)}
.modal-head .x{background:none;border:none;font-size:22px;color:var(--ink-faint);line-height:1}
.modal-body{padding:20px 22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--grey);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.gate-req{background:var(--red-tint);color:var(--red);border-radius:8px;padding:10px 13px;font-size:12.5px;font-weight:600;margin-bottom:16px;display:flex;gap:8px}
.gate-req.assist{background:var(--amber-tint);color:var(--amber)}
.gate-req.lead{background:var(--green-tint);color:var(--green)}
.outcome-opts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.outcome-opt{flex:1;min-width:120px;border:1.5px solid var(--grey);border-radius:9px;padding:11px;text-align:left;background:#fff}
.outcome-opt.sel{border-color:var(--navy);background:var(--navy-tint)}
.outcome-opt .oname{font-weight:700;font-size:13px;color:var(--navy)}
.outcome-opt .odesc{font-size:11px;color:var(--ink-soft);margin-top:2px}
.field-lbl{font-size:12px;font-weight:700;color:var(--ink);margin:12px 0 5px;display:block}
.field-hint{font-size:11.5px;color:var(--ink-faint);margin-bottom:5px}
.err{color:var(--red);font-size:12px;font-weight:600;margin-top:6px;display:none}
.err.show{display:block}
.checkline{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;margin-top:12px;background:var(--grey-tint);padding:11px;border-radius:8px}
.checkline input{margin-top:2px}

/* TOAST */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);
  color:#fff;padding:13px 22px;border-radius:10px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);
  z-index:200;opacity:0;transition:transform .3s,opacity .3s;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast .ti{color:var(--turq);margin-right:7px;font-weight:700}

/* CONNECTORS */
.conn-row{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--grey);border-radius:9px;margin-bottom:8px}
.conn-row .cn{font-weight:700;color:var(--ink);min-width:120px}
.conn-row .cdir{font-size:11px;color:var(--ink-faint);background:var(--grey-tint);padding:2px 8px;border-radius:6px;margin-left:auto}

/* RESPONSIVE */
@media(max-width:980px){
  nav.sidebar{position:static;width:100%;flex:none;height:auto;display:flex;flex-wrap:wrap;gap:4px;padding:10px}
  nav.sidebar .nav-item{margin-bottom:0}
  .nav-sec{display:none}
  .app{flex-direction:column}
  main{padding:20px 16px 50px}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .wb-cols{grid-template-columns:1fr}
  .tagline{display:none}
  .role-switch{margin-left:0}
  header{flex-wrap:wrap;height:auto;padding:10px 16px;gap:10px}
}
@media(max-width:560px){
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .role-note{display:none}
  .role-switch select{min-width:150px}
}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="mark">T</span> Trinzo</div>
  <div class="tagline">Back-office control surface — verify, don't rubber-stamp</div>
  <div class="role-switch">
    <label for="roleSel">Viewing as</label>
    <select id="roleSel"></select>
    <div class="role-note" id="roleNote"></div>
  </div>
</header>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="view"></main>
</div>

<div id="modal-overlay"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
// All data mock; refresh resets state.
"use strict";

/* ============================================================
   SECTION 1 — DATA & STATE
   ============================================================ */

// Six personas — one shared surface filtered per role.
// FLYWHEEL: three-layer alignment (leadership / middle / frontline see one truth).

// Shared clear/reject finishers
function finishClear(it,artefact,verifiedNote){
  // GATE ARTEFACT travels with the routing to next.to
  const line = artefact.who+" — "+artefact.outcome+(verifiedNote?" ("+verifiedNote+")":"")+": “"+artefact.text+"”";
  it.trail.push(line);
  it.gateArtefact=artefact;
  it.status="cleared";
  HANDOFFS.unshift({date:"20 Jul (now)",from:roleName(state.role),to:routeLabel(it.next.to),item:it.title,outcome:"Cleared — artefact carried to "+routeLabel(it.next.to)});
  // rubber-stamp signal: measure how fast/empty (accept, but record)
  bumpReviewer(artefact.text.split(/\s+/).length<4?1.0:6.5, artefact.outcome==="Reject");
  animateOut(it.id,()=>{
    render();
    toast(it.taskClass==="excluded"
      ? "Cleared — verified against "+artefact.source+". Artefact routed to "+routeLabel(it.next.to)+"."
      : "Cleared — your "+artefact.outcome.toLowerCase()+" is now travelling to "+routeLabel(it.next.to)+".");
  });
}
function finishReject(it,artefact){
  it.trail.push(artefact.who+" — REJECTED: “"+artefact.text+"”");
  it.gateArtefact=artefact;
  it.status="rejected";
  CORRECTIONS.unshift({date:"20 Jul",agent:it.provenance.engine.toUpperCase()+" — "+it.group,type:"Rejected at gate",by:artefact.who,detail:artefact.text});
  HANDOFFS.unshift({date:"20 Jul (now)",from:artefact.who,to:it.provenance.engine.toUpperCase()+" engine",item:it.title,outcome:"Rejected — reason logged as learning"});
  bumpReviewer(6.5,true);
  animateOut(it.id,()=>{ render(); toast("Rejected — reason captured as institutional learning."); });
}
function routeLabel(k){ const r=ROLES.find(x=>x.key===k); return r? r.name+" ("+r.role.split(" ")[0]+")" : k; }

function bumpReviewer(mins,rejected){
  const key = ROLES.find(r=>r.key===state.role);
  const row = ADOPTION.find(a=>a.person.startsWith(key.name));
  if(!row) return;
  const prev=row.cleared;
  row.cleared+=1;
  row.avgClearMins=+(((row.avgClearMins*prev)+mins)/row.cleared).toFixed(1);
  row.rejectRate=+((row.rejectRate*prev+(rejected?1:0))/row.cleared).toFixed(2);
  recomputeStampFlags();
}
// RUBBER-STAMP DETECTOR — Cognitive Rusting: a gate nobody fails isn't a gate.
function recomputeStampFlags(){
  ADOPTION.forEach(a=>{
    const flags=[];
    if(a.rejectRate<0.03) flags.push("Zero/near-zero rejections");
    if(a.avgClearMins<2.0) flags.push("Implausibly fast clears ("+a.avgClearMins+" min)");
    if(a.oldestQueueMins>480) flags.push("Queue ageing ("+Math.round(a.oldestQueueMins/60)+"h oldest)");
    a.flag = flags.length? flags.join(" · ") : null;
  });
}

function animateOut(id,cb){
  const el=document.querySelector('[data-item="'+id+'"]');
  if(el){ el.classList.add("removing"); setTimeout(cb,340); } else cb();
}

  setTimeout(()=>{ s.status = prev==="in-flight"?"live":prev; render(); toast(s.name+" fired — cascade queued for a human checkpoint, nothing auto-published."); },1400);
}

function provLine(p,trail){
  return `<div class="prov">${ENGINE_LABEL[p.engine]} · ${p.model} · ${p.tokens} tok · ${p.ts}`+
    (p.verifiedAgainst?` · <span class="verified">verified against ${p.verifiedAgainst} by human</span>`:"")+
    (trail?`<br>trail: ${trail.join("  →  ")}`:"")+`</div>`;
}

function engineChipInline(e){ return engineChip(e); }

// ---------- VERIFICATION QUEUE ----------
function viewQueue(){
  const items=visibleItems();
  const groups=[...new Set(items.map(i=>i.group))];
  const hasLead=items.some(i=>i.taskClass==="lead");
  let html=pageHead("Verification queue",
    "Work advances only when you produce something the machine did not — a decision, rejection, constraint, reframing, or source-check. There is no bare “Approve”. High-stakes items require a recorded primary-source check.");
  // filter bar
  html+=`<div class="filterbar"><span class="fb-label">Line</span>`
    + `<button class="fpill ${state.filters.line==='all'?'active':''}" onclick="applyFilter('line','all')">All</button>`
    + LINES.map(l=>`<button class="fpill ${state.filters.line===l?'active':''}" onclick="applyFilter('line','${l}')">${l}</button>`).join("")
    + `</div><div class="filterbar"><span class="fb-label">Engine</span>`
    + `<button class="fpill eng ${state.filters.engine==='all'?'active':''}" onclick="applyFilter('engine','all')">All</button>`
    + ENGINES.map(e=>`<button class="fpill eng ${state.filters.engine===e?'active':''}" onclick="applyFilter('engine','${e}')">${ENGINE_LABEL[e]}</button>`).join("")
    + (hasLead?`<button class="btn sm ghost" style="margin-left:auto" onclick="batchClearLead()">Batch-clear automatable (${items.filter(i=>i.taskClass==='lead').length})</button>`:"")
    + `</div>`;

  if(!items.length){
    return html+`<div class="empty"><div class="big">Nothing waiting on you</div><p>Your queue is clear. No throughput celebration — this space stays calm on purpose.</p></div>`;
  }
  groups.forEach(g=>{
    const gi=items.filter(i=>i.group===g);
    html+=`<div class="qgroup-title">${g} <span class="cnt">${gi.length}</span></div>`;
    gi.forEach(i=>{ html+=queueCard(i); });
  });
  return html;
}

function queueCard(i){
  const needsFrame=(i.taskClass==="assist"||i.taskClass==="excluded") && !i.frame;
  let inner=`<div class="qmeta">${engineChip(i.engine)} ${classBadge(i.taskClass)} <span class="chip ghost">${i.line}</span>${i.flagged?'<span class="chip amber">⚑ exception</span>':''}</div>`;
  inner+=`<h3>${i.title}</h3>`;
  if(needsFrame){
    // hide the machine draft until framed
    inner+=`<div class="needs-frame"><div class="t">Frame it first</div>
      <div class="d">This is ${i.taskClass==='excluded'?'high-stakes':'collaborative'} work. Set the brief — the question, the constraints, what good looks like — <b>before</b> you see the machine's draft. You architect the filter; you don't just review output you didn't shape.</div>
      <button class="btn turq sm" onclick="frameItem('${i.id}')">Frame it &amp; reveal draft</button></div>`;
  } else {
    if(i.frame){
      inner+=`<div class="frame-box"><div class="ttl">Your upstream frame</div>
        <div class="row"><b>Question:</b> ${i.frame.question}</div>
        <div class="row"><b>Constraints:</b> ${i.frame.constraints}</div>
        <div class="row"><b>Good looks like:</b> ${i.frame.whatGoodLooksLike}</div></div>`;
    }
    inner+=`<div class="qbody">${i.body}</div>`;
    if(i.caveat) inner+=`<div class="caveat">⚠ <span>${i.caveat}</span></div>`;
    // AUDIT flags (human-classifiable; never a passing score)
    if(i.engine==="audit" && i.auditFlags.length){
      inner+=`<div class="audit-flags"><div style="font-size:11px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Issues surfaced — awaiting your classification (no AI verdict)</div>`;
      i.auditFlags.forEach((f,idx)=>{
        const st=f.status;
        const stChip = st==="unclassified"?'<span class="aflag-status" style="background:var(--grey);color:var(--slate)">unclassified</span>':
          st==="valid"?'<span class="aflag-status" style="background:var(--red-tint);color:var(--red)">valid issue</span>':
          st==="addressed"?'<span class="aflag-status" style="background:var(--green-tint);color:var(--green)">addressed</span>':
          '<span class="aflag-status" style="background:var(--grey-tint);color:var(--slate)">not an issue</span>';
        inner+=`<div class="aflag"><div class="claim">${f.claim} ${stChip}</div>
          <div class="src">source: ${f.source}</div>
          <div class="fbtns">
            <button class="tiny-btn ${st==='valid'?'on-valid':''}" onclick="classifyAuditFlag('${i.id}',${idx},'valid')">Valid issue</button>
            <button class="tiny-btn ${st==='addressed'?'on-addressed':''}" onclick="classifyAuditFlag('${i.id}',${idx},'addressed')">Addressed</button>
            <button class="tiny-btn ${st==='wrong'?'on-wrong':''}" onclick="classifyAuditFlag('${i.id}',${idx},'wrong')">Not an issue</button>
          </div></div>`;
      });
      if(i.actions){ inner+=`<div style="font-size:12px;color:var(--ink-soft);margin-top:4px">Suggested actions: ${i.actions.map(a=>'“'+a+'”').join(" · ")}</div>`; }
      inner+=`</div>`;
    }
    inner+=`<div class="routing">Suggested routing → <b>${routeLabel(i.next.to)}</b> — ${i.next.reason}</div>`;
    inner+=provLine(i.provenance,i.trail);
  }
  // actions
  let actions=``;
  if(!needsFrame){
    if(i.taskClass==="lead"){
      actions=`<button class="btn turq" onclick="openGate('${i.id}')">Clear (spot-check)</button>`;
    }else if(i.taskClass==="assist"){
      actions=`<button class="btn primary" onclick="openGate('${i.id}')">Open verification gate</button>`;
    }else{
      actions=`<button class="btn danger" onclick="openGate('${i.id}')">High-stakes gate — source-check required</button>`;
    }
  }
  const cls = i.taskClass==="excluded"?"excl":(i.flagged?"flagged":"");
  return `<div class="qitem ${cls}" data-item="${i.id}">${inner}<div class="qactions">${actions}</div></div>`;
}

      <tbody>`+RESILIENCE.map(r=>`<tr>
        <td><b>${r.workflow}</b></td><td>${r.model}</td><td>${dep(r.dependency)}</td><td>${r.fallback}</td>
        <td>${r.fallbackTested?'<span class="chip green">✓ tested</span>':'<span class="chip red">✗ NOT tested</span>'}</td></tr>`).join("")+`</tbody></table></div>
      <div style="margin-top:10px;font-size:12.5px;color:var(--ink-soft)">Two critical workflows have untested fallbacks — the highest-priority resilience gap. Both name people as the fallback, which is the durable one.</div></div>`;
}

// ---------- PROVENANCE & COST ----------
function viewProvenance(){
  let html=pageHead("Provenance & cost",
    "Every AI artefact carries its provenance. Corrections are captured as institutional learning (informate, don't just automate), handoffs are logged, and cost is shown for transparency — not as a performance leaderboard.");
  // Corrections
  html+=`<div class="card"><h2>Corrections log <span class="sub">— informate, not just automate</span></h2>
    <div class="card-desc">Who changed what, and the patterns worth acting on.</div>
    <div class="flagrow warn"><span class="fi">◆</span><div><div class="ft">Pattern detected</div><div class="fd">“revolutionary” softened — <b>third occurrence this month</b>: candidate for a prompt update in the Workbench.</div></div></div>
    <div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Date</th><th>Agent</th><th>Change</th><th>By</th><th>Detail</th></tr></thead>
    <tbody>`+CORRECTIONS.map(c=>`<tr><td>${c.date}</td><td>${c.agent}</td><td>${c.type}</td><td>${c.by}</td><td>${c.detail}</td></tr>`).join("")+`</tbody></table></div></div>`;
  // Handoffs
  html+=`<div class="card"><h2>Handoffs log</h2>
    <div class="tbl-wrap"><table><thead><tr><th>When</th><th>From</th><th>To</th><th>Item</th><th>Outcome</th></tr></thead>
    <tbody>`+HANDOFFS.map(h=>`<tr><td>${h.date}</td><td>${h.from}</td><td>${h.to}</td><td>${h.item}</td><td>${h.outcome}</td></tr>`).join("")+`</tbody></table></div></div>`;
  // Cost + model mix
  html+=`<div class="grid grid-2">
    <div class="card"><h2>Token / cost by engine</h2><div class="tbl-wrap"><table>
      <thead><tr><th>Engine</th><th>Model</th><th>Tokens (mo)</th><th>Est. cost</th></tr></thead><tbody>
      <tr><td>${engineChip('extract')}</td><td>Haiku</td><td>142k</td><td>€3.10</td></tr>
      <tr><td>${engineChip('draft')}</td><td>Sonnet</td><td>318k</td><td>€28.40</td></tr>
      <tr><td>${engineChip('audit')}</td><td>Sonnet</td><td>206k</td><td>€18.20</td></tr>
      <tr><td>${engineChip('retrieve')}</td><td>Sonnet</td><td>174k</td><td>€15.60</td></tr>
      </tbody></table></div><div style="font-size:11.5px;color:var(--ink-faint);margin-top:8px">Cost transparency — not a leaderboard.</div></div>
    <div class="card"><h2>Model mix</h2>
      <div class="wb-field"><label>Haiku (cheap, high-volume)</label><div class="pbar"><span style="width:34%"></span></div></div>
      <div class="wb-field"><label>Sonnet (default reasoning)</label><div class="pbar navy"><span style="width:58%"></span></div></div>
      <div class="wb-field"><label>Opus (hardest / regulated)</label><div class="pbar"><span style="width:8%;background:var(--amber)"></span></div></div>
      <div style="font-size:11.5px;color:var(--ink-faint)">Right-sized per task, per the Verifiability map.</div></div>
  </div>`;
  return html;
}

// ---------- TRIGGERS ----------
function viewTriggers(){
  const dotFor=s=> s==="live"?'<span class="dot green"></span>Live':s==="scheduled"?'<span class="dot turq"></span>Scheduled':s==="manual"?'<span class="dot grey"></span>Manual':'<span class="dot amber pulse"></span>In-flight';
  return pageHead("Workflows & triggers",
    "Every trigger states its human checkpoint. None auto-publish — cascades queue work for a person, they don't act on their own.")
  + `<div class="card">`+SURVEYS.map(s=>`<div class="conn-row" style="align-items:flex-start">
      <div style="min-width:150px">${dotFor(s.status)}</div>
      <div style="flex:1"><div style="font-weight:700;color:var(--ink)">${s.name} <span style="font-weight:400;color:var(--ink-faint);font-size:12px">· ${s.cadence}</span></div>
        <div style="font-size:12.5px;color:var(--ink-soft);margin-top:3px"><b>Human checkpoint:</b> ${s.checkpoint}</div>
        <div style="font-size:12px;color:var(--ink-faint);margin-top:2px">Cascade: ${s.cascade}</div></div>
      <button class="btn sm ghost" onclick="fireTrigger('${s.id}')" ${s.status==='in-flight'?'disabled':''}>Fire (simulate)</button>
    </div>`).join("")+`</div>`;
}

// ---------- CONNECTORS ----------
function viewConnectors(){
  const dot=s=>`<span class="dot ${s}"></span>`;
  return pageHead("SaaS connectors",
    "Connection health and read/write direction across the stack.")
  + `<div class="card">`+CONNECTORS.map(c=>`<div class="conn-row">
      ${dot(c.status)}<span class="cn">${c.name}</span>
      <span style="font-size:12px;color:var(--ink-soft)">${c.status==='green'?'Connected':'Degraded'}</span>
      <span class="cdir">${c.dir}</span></div>`).join("")+`</div>`;
}

// ---------- ENGINE CONFIG ----------
function viewEngines(){
  return pageHead("Engine configuration",
    "Per-engine settings and default task classes. Rulings that decide gate strength live in the Verifiability map — this page defers to it.")
  + `<div class="card"><div class="flagrow ok"><span class="fi">◈</span><div><div class="ft">Default task classes derive from the Verifiability map</div><div class="fd"><button class="btn sm ghost" onclick="go('vmap')">Open Verifiability map →</button></div></div></div>
    <div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Engine</th><th>Purpose</th><th>Default class</th><th>Model</th><th>Gates</th></tr></thead>
    <tbody>`+ENGINE_CONFIG.map(e=>`<tr><td>${engineChip(e.engine)}</td><td>${e.desc}</td><td>${classBadge(e.defClass)}</td><td>${e.model}</td><td>${e.gates}</td></tr>`).join("")+`</tbody></table></div></div>`;
}

// ---------- SETTINGS ----------
function viewSettings(){
  const rows=[
    ["Margin floor",SETTINGS.marginFloor],
    ["Proposal SLA",SETTINGS.slaProposal],
    ["Pre-sales SLA",SETTINGS.slaPresales],
    ["Gate default — AI-led",SETTINGS.gateDefaultLead],
    ["Gate default — AI-assist",SETTINGS.gateDefaultAssist],
    ["Gate default — AI-excluded",SETTINGS.gateDefaultExcluded],
    ["Rubber-stamp: min reject rate",SETTINGS.rubberStampMinReject],
    ["Rubber-stamp: min clear time",SETTINGS.rubberStampMinMins],
    ["Queue-age alert",SETTINGS.queueAgeAlert]
  ];
  return pageHead("Settings & rules",
    "Thresholds that govern the surface. The gate-strength and rubber-stamp defaults are load-bearing — they are why a gate can actually be failed.")
  + `<div class="card"><div class="tbl-wrap"><table><thead><tr><th>Setting</th><th>Value</th></tr></thead>
    <tbody>`+rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join("")+`</tbody></table></div>
    <div style="font-size:12px;color:var(--ink-faint);margin-top:10px">Exec plan targets — Revenue ${EXECPLAN[0].target} (${EXECPLAN[0].progressPct}%), Margin ${EXECPLAN[1].target} (${EXECPLAN[1].progressPct}%).</div></div>`;
}

// ---- init ----
recomputeStampFlags();
render();
// keep exec plan referenced for role-specific extension without dead-code warnings
if(state.role==="exec"){ /* exec plan surfaced in Today/settings */ }
</script>
